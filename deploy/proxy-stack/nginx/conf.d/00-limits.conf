# Счётчики частоты обращений. Подключается в http-контексте вместе с остальным
# из conf.d, поэтому едет на сервер обычной раскладкой сайта и не требует
# правки общего nginx.conf - того самого, который делят все сайты.
#
# Имя начинается с нулей нарочно: файл читается раньше vhost'ов, которые на эти
# зоны ссылаются, и глазами видно, что он не про конкретный сайт.

# --- частота обращений за кусками видео ---
# Зритель тянет кусок раз в несколько секунд, скачиватель - десятками в
# секунду: разница между просмотром и выкачиванием видна именно здесь.
# Порог с запасом на общий выход в сеть, за которым сидит контора или мобильный
# оператор: там за одним адресом смотрят сразу несколько человек, и строгий
# счёт обрывал бы просмотр им всем.
limit_req_zone $binary_remote_addr zone=hls:10m rate=3r/s;
limit_req_status 429;
