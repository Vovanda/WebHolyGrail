name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version берётся из package.json:packageManager (без явного override)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # payload-types.ts и importMap.js gitignored (генерируются на dev/build) —
      # в чистом checkout их нет, tsc падает. Dummy env: конфиг только грузится,
      # коннекта к S3/DB нет.
      - name: Generate Payload artifacts
        env:
          PAYLOAD_SECRET: ci-dummy-not-used
          DATABASE_URI: file:/tmp/ci.db
          S3_BUCKET: ci-dummy
          S3_REGION: us-east-1
          S3_ENDPOINT: https://ci.invalid
          S3_ACCESS_KEY_ID: ci-dummy
          S3_SECRET_ACCESS_KEY: ci-dummy
        run: |
          pnpm --filter cms run generate:types
          pnpm --filter cms run generate:importmap
          # generate:importmap умеет завершиться с нулевым кодом, ничего не
          # записав. Без этой проверки следующим падает tsc с «Cannot find
          # module '../importMap.js'», и причина выглядит как ошибка в коде.
          for f in src/cms/src/app/\(payload\)/admin/importMap.js src/cms/src/payload-types.ts; do
            if [ ! -s "$f" ]; then
              echo "::error::$f не сгенерирован — payload generate отработал вхолостую"
              exit 1
            fi
          done

      # push: false — схема попадает в БД только миграцией. Коллекция/поле без
      # migrate:create = деплой встаёт со старой схемой и падает в рантайме.
      - name: Schema vs migrations drift
        env:
          PAYLOAD_SECRET: ci-dummy-not-used
          DATABASE_URI: file:/tmp/ci.db
          S3_BUCKET: ci-dummy
          S3_REGION: us-east-1
          S3_ENDPOINT: https://ci.invalid
          S3_ACCESS_KEY_ID: ci-dummy
          S3_SECRET_ACCESS_KEY: ci-dummy
        run: pnpm --filter cms run check:schema

      # Разметка файлов шаблона должна совпадать с деревом: иначе добавленное
      # не доедет до сайтов, и узнается это через прогон обновления на живом.
      - name: Template zones registry
        run: node scripts/zones.mjs --check

      # Отставание от шаблона ничем не заметно: сборка зелёная, прогон зелёный,
      # а привезённое не подключено. Шаг говорит разрыв словами и прогон не
      # роняет - отставший сайт не сломан, он отстал. В самом шаблоне молчит.
      - name: Template drift
        env:
          TEMPLATE_TOKEN: ${{ secrets.TEMPLATE_READ_TOKEN }}
        run: node scripts/template-drift.mjs

      - run: pnpm -r lint

      - run: pnpm -r test
